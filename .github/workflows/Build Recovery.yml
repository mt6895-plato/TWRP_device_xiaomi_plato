name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/mt6895-plato/TWRP_device_xiaomi_plato'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'TWRP-12.1_A15-HOS'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/plato'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'plato'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_plato'
      OUTPUT_FILENAME:
        description: 'Type the desired final file name (example: TWRP-X00TD.img)'
        required: true
        default: 'twrp-3.7.1-12.1-A15-HyperOS-vendor_boot-plato.img'
      RELEASE_TAG:
        description: 'Type GitHub Release Tag name (example: v3.7.1-2)'
        required: true
        default: '3.7.1-12.1-A15-HOS'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "::endgroup::"

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "archcloudy"
        git config --global user.email "86261006+archcloudy@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && mka vendorbootimage -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Rename Output File
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        cp vendor_boot.img ${{ github.event.inputs.OUTPUT_FILENAME }}
        echo "File successfully renamed to ${{ github.event.inputs.OUTPUT_FILENAME }}"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.OUTPUT_FILENAME }}
        name: TWRP ${{ github.event.inputs.DEVICE_NAME }} - ${{ github.event.inputs.RELEASE_TAG }}
        tag_name: ${{ github.event.inputs.RELEASE_TAG }}
        body: |
          TWRP 3.7.1-01 12.1-A15
          Based on **HyperOS OS2.0.214.0.VLQMIXM** (Android 15)

          Changelogs:
          - Encryption working ✅ 

          Notes:
          - Only compatible with OS2.0.214.0.VLQMIXM firmware
          - Flash this image to vendor_boot_ab
          - Open issue for any bugs you find

          -> thanks @JonesqPacMan for trees

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}